local_costmap:
  global_frame: map
  robot_base_frame: base_link
  footprint: [[0.30, 0.275], [0.30, -0.275], [-0.30, -0.275], [-0.30, 0.275]]
  update_frequency: 10.0
  publish_frequency: 5.0
  transform_tolerance: 0.5
  rolling_window: true
  width: 8.0
  height: 8.0
  resolution: 0.10
  track_unknown_space: true
  plugins:
    - {name: drivable_layer, type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  drivable_layer:
    map_topic: /lio_sam/drivable_area/grid
    subscribe_to_updates: false
    track_unknown_space: true
    use_maximum: false
    lethal_cost_threshold: 80
    unknown_cost_value: -1
    trinary_costmap: true

  obstacle_layer:
    observation_sources: ouster_points
    combination_method: 1
    track_unknown_space: true
    footprint_clearing_enabled: true
    max_obstacle_height: 1.50
    obstacle_range: 4.5
    raytrace_range: 4.0
    ouster_points:
      data_type: PointCloud2
      topic: /ouster/points
      marking: true
      clearing: true
      min_obstacle_height: -0.25
      max_obstacle_height: 1.50
      expected_update_rate: 0.0
      observation_persistence: 0.25
      inf_is_valid: false

  inflation_layer:
    inflation_radius: 0.35
    cost_scaling_factor: 10.0
